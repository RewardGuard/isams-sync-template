name: isams-sync

on:
  schedule:
    - cron: "7 */4 * * *"   # cada 4 horas (UTC)
  workflow_dispatch:         # boton "Run workflow" para correrlo a mano

permissions:
  contents: write            # guardar data/latest.json
  issues: write              # abrir un Issue cuando hay cambios negativos

concurrency:
  group: isams-sync
  cancel-in-progress: false

jobs:
  sync:
    # Solo corre en TU copia privada (setup.sh crea la variable ISAMS_ENABLED).
    if: ${{ vars.ISAMS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Seguridad - el repo debe ser privado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          private=$(gh api "repos/${{ github.repository }}" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::error::Este repo es PUBLICO y guardaria calificaciones y conducta. Hazlo privado y vuelve a correr."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Login y sincronizar
        env:
          ISAMS_SCHOOL: ${{ secrets.ISAMS_SCHOOL }}
          ISAMS_STUDENT_ID: ${{ secrets.ISAMS_STUDENT_ID }}
          ISAMS_USER: ${{ secrets.ISAMS_USER }}
          ISAMS_PASS: ${{ secrets.ISAMS_PASS }}
          ISAMS_DATA_DIR: data
          CI_ALERT_FILE: alert.md
        run: |
          python isams_client.py login
          python isams_sync.py

      - name: Guardar datos
        run: |
          git config user.name "isams-bot"
          git config user.email "isams-bot@users.noreply.github.com"
          git add -f data
          git diff --cached --quiet || git commit -m "isams: actualizacion $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - name: Avisar si hay cambios negativos
        if: ${{ hashFiles('alert.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "" >> alert.md
          echo "cc @${{ github.repository_owner }}" >> alert.md
          gh issue create --title "iSAMS: cambios negativos ($(date -u +'%Y-%m-%d'))" --body-file alert.md
